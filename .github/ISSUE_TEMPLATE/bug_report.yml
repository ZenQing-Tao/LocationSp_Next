name: Bug 报告 / Bug report
description: 只接受程序本身的缺陷（崩溃、功能异常、界面错误等）。Not for app adaptation or bypassing risk control.
title: "[Bug] "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        ⚠️ **提交前请确认（不符合的 Issue 会被直接关闭）**

        1. 本项目**不提供「适配某个 App」的支持**，也不提供「绕过风控 / 反作弊 / 通过某平台校验」的能力或技术支持。
        2. 只接受**程序自身的 bug**：崩溃、功能异常、界面错误、构建失败等。
        3. 请先搜索已有 Issue，避免重复。
        4. **不要**在 Issue 里粘贴 Key、Token、密码、签名文件或精确的个人轨迹。
  - type: checkboxes
    id: confirm
    attributes:
      label: 确认
      options:
        - label: 我已阅读上面的提交要求，且本 Issue 不涉及适配/绕风控类请求
          required: true
        - label: 我已在最新发布版上复现过该问题
          required: true
  - type: dropdown
    id: scheme
    attributes:
      label: 模拟方案
      options:
        - scoped（非全局，LSPosed 作用域勾选目标 App）
        - global（全局，Hook 系统服务）
        - 不确定
    validations:
      required: true
  - type: input
    id: app_version
    attributes:
      label: 应用版本
      placeholder: 如 3.1.1（设置→信息页可看到）
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: 设备与系统
      placeholder: 如 Xiaomi 10 Pro（cmi）/ Android 17 / HyperOS 4
    validations:
      required: true
  - type: input
    id: root_stack
    attributes:
      label: Root 与框架版本
      placeholder: 如 APatch 115020 + Zygisk Next 1.2.4 + LSPosed 1.9.3（libxposed API 102）
    validations:
      required: true
  - type: textarea
    id: what_happened
    attributes:
      label: 问题描述
      description: 实际发生了什么？有没有报错弹窗或崩溃？
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开 App，进入…
        2. 设置…
        3. 点击…，崩溃
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望行为
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 日志 / 截图（可选）
      description: |
        日志可用：`logcat -d > log.txt`，再把相关部分贴进来。
        **请先删掉 Key / Token / 密码 / 精确位置等敏感信息。**
      render: text
    validations:
      required: false
  - type: markdown
    attributes:
      value: |
        感谢反馈。请注意：本项目仅为学习研究与自有设备/授权环境测试提供支持，不对任何封号、账号限制等后果负责。
