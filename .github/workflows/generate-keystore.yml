name: Generate Keystore (one-off)
on:
  workflow_dispatch:
    inputs:
      password:
        description: 'keystore 密码（同时作为 key 密码）'
        required: true
      alias:
        description: 'key alias'
        required: false
        default: 'locationspnext'
permissions:
  contents: read
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate keystore
        run: |
          keytool -genkeypair -v -keystore keystore.jks \
            -alias "${{ inputs.alias }}" \
            -keyalg RSA -keysize 4096 -validity 10950 \
            -storepass "${{ inputs.password }}" \
            -keypass "${{ inputs.password }}" \
            -dname "CN=LocationSp_Next, OU=Android, O=ZenQing-Tao, C=CN"
          keytool -list -v -keystore keystore.jks -storepass "${{ inputs.password }}" | grep -E "SHA1|SHA256"
      - name: Upload keystore
        uses: actions/upload-artifact@v4
        with:
          name: keystore
          path: keystore.jks
          retention-days: 1
