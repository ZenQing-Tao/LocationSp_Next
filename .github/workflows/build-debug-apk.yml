name: Build Installable APKs

# 手动触发的构建：不需要任何密钥，产出可直接安装的 Debug APK。
# 与 release.yml 区别：release.yml 依赖 KEYSTORE_* 密钥做正式签名，
# 且只在版本号变化时自动触发；本 workflow 走 debug 签名，随时可跑。
on:
  workflow_dispatch:
    inputs:
      google_maps_api_key:
        description: '可选：Google Maps API Key（留空则 Google 地图不可用，其余功能正常）'
        required: false
        default: ''
      scheme:
        description: '构建哪些方案'
        type: choice
        options:
          - both
          - scoped
          - global
        default: both

permissions:
  contents: write
  checks: write
  pull-requests: write
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 合规自检：仓库内不得出现任何第三方地图 Key / 他人样式 ID。
      # 放在最前面，一旦有人误提交 Key 立刻失败，不会产出带凭证的安装包。
      - name: Verify no third-party keys
        run: bash scripts/verify-no-keys.sh

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # GitHub runner 已自带可用的 Android SDK，这里直接用预置的 sdkmanager补齐
      # compileSdk 37 所需的 platform 与 build-tools，不再依赖
      # android-actions/setup-android —— 该 action 当前在 runner 上会
      # 因 sdkmanager 签名校验 / 已下线的 'tools' 包而 exit 1。
      - name: Install SDK packages
        id: sdk
        continue-on-error: true
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-$HOME/Android/Sdk}"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            for c in "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager; do
              [ -x "$c" ] && SDKMANAGER="$c" && break
            done
          fi
          if [ ! -x "$SDKMANAGER" ]; then
            echo "找不到 sdkmanager，ANDROID_HOME=$ANDROID_HOME"
            ls -la "$ANDROID_HOME" || true
            exit 1
          fi
          echo "使用: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --install "platform-tools"

          # compileSdk 37 可能尚未发布（项目用AGP 9.3.1，compileSdk = 37）。
          # 这里自适应：优先装37，不存在就退回 runner 上已装的最高版本平台，
          # 并用 compileSdkVersion 覆盖，让构建至少有机会跑起来。
          #
          # 关键：sdkmanager --list 里 platforms;android-37 这样的「纯大版本」条目
          # 通常并不存在，实际存在的是带小版本号的条目（android-37.0 / 37.1 / 37.2-betaN）。
          # 因此这里直接列出 --list 中真实存在的 platforms 条目，按「去掉 beta 后数值最大」
          # 排序取第一个去安装；只有取不到时才逐个大版本号降级尝试。
          PLATFORM=""
          CANDIDATES="$("$SDKMANAGER" --list 2>/dev/null \
                | sed -n 's/^[[:space:]]*platforms;android-\([0-9][0-9.]*\).*/\1/p' \
                | grep -v -E '(beta|rc|dev)' \
                | awk -F. '{ printf "%d.%03d\n", $1, $2 }' \
                | sort -rn | head -n1)"
          if [ -n "$CANDIDATES" ]; then
            VER="$(echo "$CANDIDATES" | awk -F. '{ printf "%d.%d", $1, $2 }')"
            echo ">>> 候选平台: platforms;android-$VER"
            if "$SDKMANAGER" --install "platforms;android-$VER"; then
              PLATFORM="$VER"
            fi
          fi
          # 兜底：按大版本号逐个尝试
          for CAND in 37 36 35; do
            [ -n "$PLATFORM" ] && break
            echo ">>> 尝试 platforms;android-$CAND"
            "$SDKMANAGER" --install "platforms;android-$CAND" && PLATFORM="$CAND" || true
          done
          if [ -z "$PLATFORM" ]; then
            echo "警告：未能安装任何平台，继续构建让 Gradle 给出明确报错"
            echo "COMPILE_SDK=36" >> "$GITHUB_OUTPUT"
          else
            echo "COMPILE_SDK=$PLATFORM" >> "$GITHUB_OUTPUT"
          fi

          # build-tools 取最新的稳定版（排除 pre/rc）
          BT="$("$SDKMANAGER" --list 2>/dev/null \
                | sed -n 's/^[[:space:]]*build-tools;\([0-9][0-9.]*\).*/\1/p' \
                | grep -v -E '(rc|beta|pre)' | sort -V | tail -n1)"
          if [ -z "$BT" ]; then
            echo "无法解析可用的 build-tools 版本，改为安装默认最新版本"
            "$SDKMANAGER" --install "build-tools"
          else
            echo "使用 build-tools;$BT"
            "$SDKMANAGER" --install "build-tools;$BT"
          fi
          echo "已安装的platforms："
          ls "$ANDROID_HOME/platforms" || true

      - name: Write compileSdk to gradle
        if: ${{ steps.sdk.outputs.COMPILE_SDK != '' }}
        run: |
          SDK="${{ steps.sdk.outputs.COMPILE_SDK }}"
          MAJOR="${SDK%%.*}"
          echo "本次使用 compileSdk = $SDK (major=$MAJOR)"
          printf '\n# 由 CI 按可用 SDK 自动回退\nandroid.suppressUnsupportedCompileSdk=%s\n' "$SDK" >> gradle.properties
          # gradle 的 compileSdk 只接受整数（如 37），不能写 37.1。
          # 只有主版本真的低于 37 时才改写各模块；37.x 保持仓库里的 compileSdk = 37 不动。
          if [ "$MAJOR" -lt 37 ]; then
            for f in app/build.gradle.kts app-ui/build.gradle.kts core-data/build.gradle.kts core-geo/build.gradle.kts service/build.gradle.kts xposed/build.gradle.kts; do
              [ -f "$f" ] && sed -i "s/compileSdk = 37/compileSdk = $MAJOR/g" "$f"
            done
            echo "已把各模块 compileSdk 降级为 $MAJOR"
            echo "::warning::compileSdk 被降级到 $MAJOR，miuix 等依赖要求 37+，构建可能失败"
          else
            echo "compileSdk 主版本 >= 37，保持仓库原值 compileSdk = 37"
          fi

      - name: Provide Google Maps key
        if: ${{ inputs.google_maps_api_key != '' }}
        run: |
          echo "GOOGLE_MAPS_API_KEY: ${{ inputs.google_maps_api_key }}" > local.yml

      - name: Build APKs
        id: build
        continue-on-error: true
        run: |
          case "${{ inputs.scheme }}" in
            scoped) TASKS=":app:assembleScopedDebug" ;;
            global) TASKS=":app:assembleGlobalDebug" ;;
            both)   TASKS=":app:assembleScopedDebug :app:assembleGlobalDebug" ;;
          esac
          echo "Building: $TASKS"
          RC=0
          # 与 release.yml 同样的坑：一次调用里并行打包多个变体 × ABI 拆分时，
          # AGP 的签名摘要任务会和打包写文件任务抢占 ForkJoinPool 而互相死锁。
          # 因此这里按变体逐个调用，并且不要 set -e，否则单个变体失败会直接
          # 跳过后面的变体，也看不出到底哪个任务出了问题。
          for T in $TASKS; do
            echo "---- gradle $T ----"
            # 全量落盘，便于诊断步骤提取关键错误
            ./gradlew --no-daemon "$T" 2>&1 | tee -a gradle-build.log || RC=${PIPESTATUS[0]}
          done
          echo "gradle exit code: $RC"
          echo "=== build 目录概览 ==="
          find app/build -maxdepth 2 -type d 2>/dev/null | head -n 30 || true
          echo "=== 全仓库 *.apk ==="
          find . -name "*.apk" -type f -not -path "./.git/*" 2>/dev/null | head -n 30 || true
          exit $RC

      - name: Collect APKs
        id: collect
        run: |
          mkdir -p dist
          # 不写死 APK 输出目录：AGP 9 配合 ABI 拆分时产物路径随版本变化，
          # 这里从 app/build/outputs 下递归收集，再按文件名里的 scheme/abi 标记重命名。
          OUT_ROOT="app/build/outputs"
          if [ ! -d "$OUT_ROOT" ]; then
            echo "错误：找不到 $OUT_ROOT，构建可能未真正产出任何文件"
            exit 1
          fi
          echo "=== outputs 目录结构 ==="
          find "$OUT_ROOT" -maxdepth 3 -type d | head -n 40
          echo "=== 原始 APK 列表 ==="
          find "$OUT_ROOT" -name "*.apk" -type f | head -n 40

          find "$OUT_ROOT" -name "*.apk" -type f -print0 | while IFS= read -r -d '' file; do
            BASENAME=$(basename "$file")
            SCHEME="scoped"
            [[ "$BASENAME" == *"-global"* ]] && SCHEME="global"
            if [[ "$BASENAME" == *"arm64-v8a"* ]]; then
              ABI="arm64-v8a"
            elif [[ "$BASENAME" == *"armeabi-v7a"* ]]; then
              ABI="armeabi-v7a"
            else
              ABI="universal"
            fi
            cp "$file" "dist/LocationSpoofer-$SCHEME-$ABI.apk"
          done
          ls -l dist/ || true
          COUNT=$(find dist -name "*.apk" 2>/dev/null | wc -l)
          echo "APK_COUNT=$COUNT" >> "$GITHUB_OUTPUT"
          echo "共产出 $COUNT 个安装包"

      # 把 Gradle 日志作为 artifact 上传：run summary 与网页日志都需要登录后才能看，
      # 而 artifact 下载接口是公开的，便于外部直接取到真实报错。
      - name: Upload build log
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: |
            gradle-build.log
            app/build/outputs/
          if-no-files-found: warn
          retention-days: 7

      # 失败时把关键信息汇总到 run summary，避免在几百行日志里翻找。
      # annotation 会出现在 check-runs 的 annotations 接口里，便于外部直接读取
      # （run summary 只有登录后在网页上才看得到，日志下载接口需要更高权限）。
      - name: Report diagnostics
        if: ${{ always() }}
        run: |
          set +e
          LOGS=""
          if [ -f gradle-build.log ]; then
            LOGS=$(grep -nE "FAILURE:|What went wrong|^e: |error:|Caused by:|Execution failed|Could not (find|resolve|compile|download)|A problem occurred" gradle-build.log | head -n 25)
          fi
          PLATFORMS=$(ls "$ANDROID_HOME/platforms" 2>&1 | tr '\n' ' ')
          APKS=$(find . -name "*.apk" -type f -not -path "./.git/*" 2>/dev/null | head -n 10 | tr '\n' ' ')
          COMPILE_SDK_USED="${{ steps.sdk.outputs.COMPILE_SDK }}"
          BUILD_OUTCOME="${{ steps.build.outcome }}"

          # 写成真正的 workflow annotation（会出现在 check-runs annotations 接口）
          {
            echo "::error title=构建诊断::compileSdk=${COMPILE_SDK_USED:-未设置} build=${BUILD_OUTCOME} platforms=[${PLATFORMS}] apks=[${APKS}]"
          }
          # Gradle 关键错误逐行发成 annotation，确保外部能读到
          if [ -n "$LOGS" ]; then
            echo "$LOGS" | head -n 12 | while IFS= read -r line; do
              [ -n "$line" ] && echo "::error title=Gradle::${line:0:200}"
            done
          fi
          if [ ! -f gradle-build.log ]; then
            echo "::error title=Gradle::gradle-build.log 不存在，gradlew 未执行"
          fi

          {
            echo "## 构建诊断"
            echo ""
            echo "- 编译步骤: \`${BUILD_OUTCOME}\`"
            echo "- 采用的 compileSdk: \`${COMPILE_SDK_USED:-未设置}\`"
            echo ""
            echo "### 已安装的平台"
            echo '```'
            echo "${PLATFORMS:-无}"
            echo '```'
            echo ""
            echo "### 全仓库 *.apk"
            echo '```'
            echo "${APKS:-无}"
            echo '```'
            echo ""
            echo "### Gradle 关键错误"
            echo '```'
            echo "${LOGS:-未匹配到FAILURE/ error 行}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify build produced APKs
        run: |
          if [ "${{ steps.collect.outputs.APK_COUNT }}" = "0" ]; then
            echo "::error::没有产出任何 APK"
            exit 1
          fi
          echo "产出 ${{ steps.collect.outputs.APK_COUNT }} 个 APK"

      - name: Publish APKs to GitHub Release
        if: ${{ steps.build.outcome == 'success' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: debug-build-${{ github.run_number }}
          name: Debug 构建 ${{ github.run_number }}
          body: |
            由 `build-debug-apk.yml` 手动触发产出，使用 **debug 签名**。

            - 直接安装即可，无需额外配置
            - 与正式签名的 release 版本签名不同，**不能覆盖安装**，需先卸载旧版
            - 包名 `com.vincenthzr.locationspoofer`
            - `scoped`：在 LSPosed 作用域里勾选目标 App
            - `global`：Hook 系统服务，对全设备生效

            **重要**：本项目源码不包含任何登录/订阅逻辑，装上后直接用。
            地图与第三方数据源请在「设置」里填自己的 Key：
            - 高德 / 百度 / Google → 设置 → 地图引擎与密钥
            - WiGLE / OpenCellID → 设置 → 环境数据源 Token
          files: dist/*.apk
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}