name: Build Installable APKs

# 手动触发的构建：不需要任何密钥，产出可直接安装的 Debug APK。
# 与 release.yml 区别：release.yml 依赖 KEYSTORE_* 密钥做正式签名，
# 且只在版本号变化时自动触发；本 workflow 走 debug 签名，随时可跑。
on:
  workflow_dispatch:
    inputs:
      google_maps_api_key:
        description: '可选：Google Maps API Key（留空则 Google 地图不可用，其余功能正常）'
        required: false
        default: ''
      scheme:
        description: '构建哪些方案'
        type: choice
        options:
          - both
          - scoped
          - global
        default: both

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # GitHub runner 已自带可用的 Android SDK，这里直接用预置的 sdkmanager补齐
      # compileSdk 37 所需的 platform 与 build-tools，不再依赖
      # android-actions/setup-android —— 该 action 当前在 runner 上会
      # 因 sdkmanager 签名校验 / 已下线的 'tools' 包而 exit 1。
      - name: Install SDK packages
        id: sdk
        continue-on-error: true
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-$HOME/Android/Sdk}"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            for c in "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager; do
              [ -x "$c" ] && SDKMANAGER="$c" && break
            done
          fi
          if [ ! -x "$SDKMANAGER" ]; then
            echo "找不到 sdkmanager，ANDROID_HOME=$ANDROID_HOME"
            ls -la "$ANDROID_HOME" || true
            exit 1
          fi
          echo "使用: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --install "platform-tools"

          # compileSdk 37 可能尚未发布（项目用AGP 9.3.1，compileSdk = 37）。
          # 这里自适应：优先装37，不存在就退回 runner 上已装的最高版本平台，
          # 并用 compileSdkVersion 覆盖，让构建至少有机会跑起来。
          if "$SDKMANAGER" --list 2>/dev/null | grep -qE '^\s*platforms;android-37\s*$'; then
            echo ">>> 安装 platforms;android-37"
            "$SDKMANAGER" --install "platforms;android-37"
            echo "COMPILE_SDK=37" >> "$GITHUB_OUTPUT"
          else
            echo ">>> platforms;android-37 尚未发布，回退到已安装的最高平台"
            "$SDKMANAGER" --list 2>/dev/null | sed -n 's/^[[:space:]]*platforms;android-\([0-9][0-9]*\).*/\1/p' | sort -n | tail -n1 > api.txt || true
            API="$(cat api.txt 2>/dev/null | tr -dc '0-9')"
            if [ -n "$API" ]; then
              echo ">>> 安装 platforms;android-$API"
              "$SDKMANAGER" --install "platforms;android-$API"
              echo "COMPILE_SDK=$API" >> "$GITHUB_OUTPUT"
            else
              echo "无法确定可用平台版本"
              echo "COMPILE_SDK=36" >> "$GITHUB_OUTPUT"
            fi
          fi

          BT="$("$SDKMANAGER" --list 2>/dev/null \
                | sed -n 's/^[[:space:]]*build-tools;\([0-9][0-9.]*\).*/\1/p' \
                | sort -V | tail -n1)"
          if [ -z "$BT" ]; then
            echo "无法解析可用的 build-tools 版本，改为安装默认最新版本"
            "$SDKMANAGER" --install "build-tools"
          else
            echo "使用 build-tools;$BT"
            "$SDKMANAGER" --install "build-tools;$BT"
          fi
          echo "已安装的platforms："
          ls "$ANDROID_HOME/platforms" || true

      - name: Write compileSdk to gradle
        if: ${{ steps.sdk.outputs.COMPILE_SDK != '' }}
        run: |
          SDK="${{ steps.sdk.outputs.COMPILE_SDK }}"
          echo "本次使用 compileSdk = $SDK"
          printf '\n# 由 CI 按可用 SDK 自动回退\nandroid.suppressUnsupportedCompileSdk=%s\n' "$SDK" >> gradle.properties
          # 只有在确实回退了（不是 37）时才需要改compileSdk 本身
          if [ "$SDK" != "37" ]; then
            for f in app/build.gradle.kts app-ui/build.gradle.kts core-data/build.gradle.kts core-geo/build.gradle.kts service/build.gradle.kts xposed/build.gradle.kts; do
              [ -f "$f" ] && sed -i "s/compileSdk = 37/compileSdk = $SDK/g" "$f"
            done
            echo "已把各模块 compileSdk 调整为 $SDK"
          fi

      - name: Provide Google Maps key
        if: ${{ inputs.google_maps_api_key != '' }}
        run: |
          echo "GOOGLE_MAPS_API_KEY: ${{ inputs.google_maps_api_key }}" > local.yml

      - name: Build APKs
        id: build
        continue-on-error: true
        run: |
          set -e
          case "${{ inputs.scheme }}" in
            scoped) TASKS=":app:assembleScopedDebug" ;;
            global) TASKS=":app:assembleGlobalDebug" ;;
            both)   TASKS=":app:assembleScopedDebug :app:assembleGlobalDebug" ;;
          esac
          echo "Building: $TASKS"
          # 与 release.yml 同样的坑：一次调用里并行打包多个变体 × ABI 拆分时，
          # AGP 的签名摘要任务会和打包写文件任务抢占 ForkJoinPool 而互相死锁。
          # 因此这里按变体逐个调用。
          for T in $TASKS; do
            ./gradlew --no-daemon "$T"
          done

      - name: Collect APKs
        id: collect
        run: |
          mkdir -p dist
          for SCHEME in scoped global; do
            APK_DIR="app/build/outputs/apk/$SCHEME/debug"
            [ -d "$APK_DIR" ] || continue
            find "$APK_DIR" -name "*.apk" -print0 | while IFS= read -r -d '' file; do
              BASENAME=$(basename "$file")
              if [[ "$BASENAME" == *"arm64-v8a"* ]]; then
                cp "$file" "dist/LocationSpoofer-$SCHEME-arm64-v8a.apk"
              elif [[ "$BASENAME" == *"armeabi-v7a"* ]]; then
                cp "$file" "dist/LocationSpoofer-$SCHEME-armeabi-v7a.apk"
              else
                cp "$file" "dist/LocationSpoofer-$SCHEME-universal.apk"
              fi
            done
          done
          ls -l dist/ || true
          COUNT=$(find dist -name "*.apk" 2>/dev/null | wc -l)
          echo "APK_COUNT=$COUNT" >> "$GITHUB_OUTPUT"
          echo "共产出 $COUNT 个安装包"

      # 失败时把关键信息汇总到 run summary，避免在几百行日志里翻找。
      - name: Report diagnostics
        if: ${{ steps.build.outcome == 'failure' || steps.sdk.outcome == 'failure' || steps.collect.outputs.APK_COUNT == '0' }}
        run: |
          {
            echo "## ❌ 构建失败"
            echo ""
            echo "- SDK 步骤: ${{ steps.sdk.outcome }}"
            echo "- 编译步骤: ${{ steps.build.outcome }}"
            echo "- 使用的 compileSdk: \`${{ steps.sdk.outputs.COMPILE_SDK || '未设置' }}\`"
            echo ""
            echo "### 环境"
            echo '```'
            java -version 2>&1 | head -n3
            echo "ANDROID_HOME=${ANDROID_HOME:-未设置}"
            ls "${ANDROID_HOME:-/nonexistent}/platforms" 2>&1 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify build produced APKs
        run: |
          if [ "${{ steps.collect.outputs.APK_COUNT }}" = "0" ]; then
            echo "::error::没有产出任何 APK"
            exit 1
          fi
          echo "产出 ${{ steps.collect.outputs.APK_COUNT }} 个 APK"

      - name: Publish APKs to GitHub Release
        if: ${{ steps.build.outcome == 'success' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: debug-build-${{ github.run_number }}
          name: Debug 构建 ${{ github.run_number }}
          body: |
            由 `build-debug-apk.yml` 手动触发产出，使用 **debug 签名**。

            - 直接安装即可，无需额外配置
            - 与正式签名的 release 版本签名不同，**不能覆盖安装**，需先卸载旧版
            - 包名 `com.vincenthzr.locationspoofer`
            - `scoped`：在 LSPosed 作用域里勾选目标 App
            - `global`：Hook 系统服务，对全设备生效

            **重要**：本项目源码不包含任何登录/订阅逻辑，装上后直接用。
            地图与第三方数据源请在「设置」里填自己的 Key：
            - 高德 / 百度 / Google → 设置 → 地图引擎与密钥
            - WiGLE / OpenCellID → 设置 → 环境数据源 Token
          files: dist/*.apk
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}